name: MTC Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write

jobs:
  review:
    name: MTC Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MTC from source
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"

          cd "$GITHUB_WORKSPACE"
          bun install
          bun run build

          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Verify MTC installation
        run: mtc --version

      - name: List files changed in PR
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const files = data.map(f => f.filename);
            core.setOutput('files', files.join('\n'));

      - name: Check for .mtc/rules
        id: check_rules
        run: |
          if [ -d ".mtc/rules" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "MTC project rules found"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No .mtc/rules found — running review with default checks"
          fi

      - name: Initialize MTC project config if needed
        if: steps.check_rules.outputs.configured != 'true'
        run: |
          mtc init --force

      - name: Run MTC review on changed files
        id: review
        run: |
          FILES="${{ steps.files.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No files changed"
            echo "result=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$FILES" > /tmp/changed_files.txt
          RESULT=$(mtc review --files $(cat /tmp/changed_files.txt | tr '\n' ' ') --json 2>&1 || true)
          echo "$RESULT" > /tmp/review_result.json

          PASSED=$(echo "$RESULT" | grep -o '"passed":[^,]*' | cut -d: -f2)
          echo "result=passed" >> "$GITHUB_OUTPUT"

          if [ "$PASSED" != "true" ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      # FIX 3: Guard post steps with fork check
      - name: Post review summary
        if: always() && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reviewResult;
            try {
              reviewResult = JSON.parse(fs.readFileSync('/tmp/review_result.json', 'utf8'));
            } catch {
              console.log('No review result file');
              return;
            }

            const { findings, summary, passed } = reviewResult;

            let body = `## MTC Code Review\n\n`;
            body += `**Result: ${passed ? '✅ PASSED' : '❌ FAILED'}**\n\n`;

            if (summary) {
              body += `### Summary\n`;
              body += `| Severity | Count |\n`;
              body += `|----------|-------|\n`;
              body += `| Critical | ${summary.critical} |\n`;
              body += `| Major | ${summary.major} |\n`;
              body += `| Minor | ${summary.minor} |\n`;
              body += `| Suggestion | ${summary.suggestion} |\n`;
              body += `| **Total** | **${summary.total}** |\n\n`;
            }

            if (findings && findings.length > 0) {
              body += `### Findings\n\n`;
              const severityOrder = { critical: 0, major: 1, minor: 2, suggestion: 3 };
              findings.sort((a, b) => (severityOrder[a.severity] || 99) - (severityOrder[b.severity] || 99));

              for (const f of findings) {
                const emoji = f.severity === 'critical' ? '🔴' :
                              f.severity === 'major' ? '🟠' :
                              f.severity === 'minor' ? '🟡' : '💡';
                const loc = f.line ? `:${f.line}` : '';
                body += `${emoji} **${f.severity.toUpperCase()}** \`${f.file}${loc}\`\n`;
                body += `   ${f.message}\n\n`;
              }
            }

            body += `---\n`;
            body += `_Review generated by [MTC Code Agent](https://github.com/mtm-LazumLyntonTawngYung/metateam-code-agent)_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.includes('MTC Code Review')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Set commit status
        if: always() && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let passed = false;
            try {
              const result = JSON.parse(fs.readFileSync('/tmp/review_result.json', 'utf8'));
              passed = result.passed === true;
            } catch {
              passed = true;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: passed ? 'success' : 'failure',
              description: passed ? 'MTC review passed' : 'MTC review found issues',
              context: 'MTC Code Review',
            });